name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies (no Blender needed)
        run: pip install numpy scipy trimesh rtree pytest
      - name: Run metric tests
        run: pytest -q tests
